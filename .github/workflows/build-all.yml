name: Build Releases

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ────────────────── Linux ──────────────────
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-

      - name: Install GStreamer & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice \
            gstreamer1.0-libav \
            gstreamer1.0-tools

      - name: Run Tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Tarball & DEB
        run: |
          mkdir -p dist
          # 1. Standalone Tarball
          tar -czvf dist/nexus-remote-client-linux-x86_64.tar.gz -C target/release nexus-remote-client

          # 2. Debian (.deb) Package
          PKG_DIR="deb-staging"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          cp target/release/nexus-remote-client "$PKG_DIR/usr/bin/"
          chmod +x "$PKG_DIR/usr/bin/nexus-remote-client"

          cat <<EOF > "$PKG_DIR/DEBIAN/control"
          Package: nexus-remote-client
          Version: 0.2.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-nice
          Maintainer: Nexus Team <info@nexusremote.io>
          Description: Ultra-Low Latency Cross-Platform Remote Desktop Client
          EOF

          dpkg-deb --build "$PKG_DIR" dist/nexus-remote-client_0.2.0_amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-linux-x86_64
          path: dist/*

  # ────────────────── Windows ──────────────────
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: Setup GStreamer
        uses: blinemedical/setup-gstreamer@v1.4.0
        with:
          version: '1.26.11'
          arch: 'x86_64'

      - name: Run Tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release

      - name: Build MSI & Portable ZIP Package
        shell: pwsh
        run: .\scripts\build-msi.ps1 -BinaryPath "target\release\nexus-remote-client.exe"

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-windows-msi
          path: nexus-remote-client-windows-x86_64.msi

      - name: Upload Windows Portable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-windows-portable
          path: nexus-remote-client-windows-portable-x86_64.zip

      - name: Upload Windows Raw Exe
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-windows-exe
          path: target/release/nexus-remote-client.exe

  # ────────────────── macOS ──────────────────
  build-macos:
    name: Build macOS (ARM64 & x86_64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install GStreamer
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install pkg-config gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly

      - name: Run Tests
        run: cargo test

      - name: Build Release Binary
        run: cargo build --release

      - name: Package macOS Tarball & PKG
        run: |
          mkdir -p dist
          # Tarball
          tar -czvf dist/nexus-remote-client-macos-arm64.tar.gz -C target/release nexus-remote-client

          # Build .pkg installer
          mkdir -p pkg-root/usr/local/bin
          cp target/release/nexus-remote-client pkg-root/usr/local/bin/nexus-remote-client
          chmod +x pkg-root/usr/local/bin/nexus-remote-client
          pkgbuild \
            --identifier com.nexus.remote.client \
            --version "0.2.0" \
            --root pkg-root \
            --install-location "/" \
            dist/nexus-remote-client-macos-arm64.pkg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-macos
          path: dist/*

  # ────────────────── GitHub Release ──────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.deb" -o -name "*.pkg" | while read -r file; do
            cp "$file" release-assets/
          done
          echo "=== Collected release assets ==="
          ls -lh release-assets/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

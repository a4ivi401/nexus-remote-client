name: Build Releases

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nexus-remote-client-linux
            binary_path: target/release/wot-remote-client
          - os: windows-latest
            artifact_name: nexus-remote-client-windows
            binary_path: target/release/wot-remote-client.exe
          - os: macos-13 # Intel x86_64
            artifact_name: nexus-remote-client-macos-intel
            binary_path: target/release/wot-remote-client
          - os: macos-14 # Apple Silicon aarch64
            artifact_name: nexus-remote-client-macos-arm
            binary_path: target/release/wot-remote-client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts (speeds up recompilation significantly)
      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # ────────────────── Linux ──────────────────
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # ────────────────── macOS ──────────────────
      # Homebrew on GitHub runners has most formulae pre-cached,
      # but GStreamer may need a fresh install. We cache the Homebrew
      # download cache to speed up subsequent runs.
      - name: Cache Homebrew (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: ${{ runner.os }}-${{ runner.arch }}-brew-gstreamer
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-brew-

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install pkg-config gstreamer || true
          # Verify GStreamer was installed and pkg-config can find it
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-webrtc-1.0

      # ────────────────── Windows ──────────────────
      # Step 1: Cache GStreamer installer (840MB — don't re-download every time)
      - name: Cache GStreamer Installer (Windows)
        if: runner.os == 'Windows'
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: gstreamer-installer
          key: gstreamer-1.28.5-msvc-x86_64

      # Step 2: Download using curl.exe (native, fast, no memory buffering)
      - name: Download GStreamer (Windows)
        if: runner.os == 'Windows' && steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: cmd
        timeout-minutes: 10
        run: |
          mkdir gstreamer-installer
          curl.exe -L --retry 3 --retry-delay 5 -o gstreamer-installer\gstreamer.exe "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.5/msvc/gstreamer-1.0-msvc-x86_64-1.28.5.exe"

      # Step 3: Install GStreamer silently
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        timeout-minutes: 5
        run: |
          start /wait gstreamer-installer\gstreamer.exe /S
          echo GStreamer installed

      # Step 4: Configure environment for cargo build
      - name: Configure GStreamer env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find where GStreamer was installed
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path $gstRoot)) {
            $gstRoot = "$env:ProgramFiles\GStreamer\1.0\msvc_x86_64"
          }
          if (-not (Test-Path $gstRoot)) {
            $found = Get-ChildItem -Path "C:\" -Filter "gstreamer-webrtc-1.0.pc" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $gstRoot = $found.DirectoryName | Split-Path -Parent | Split-Path -Parent
            }
          }
          Write-Host "GStreamer root: $gstRoot"
          $pkgConfigPath = "$gstRoot\lib\pkgconfig"
          Write-Host "PKG_CONFIG_PATH: $pkgConfigPath"
          echo "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH

      # ────────────────── Build ──────────────────
      - name: Build Client
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  # ────────────────── macOS Universal Binary + PKG ──────────────────
  package-macos:
    name: Create macOS Universal Binary & PKG
    needs: build
    runs-on: macos-14
    steps:
      - name: Download Intel Binary
        uses: actions/download-artifact@v4
        with:
          name: nexus-remote-client-macos-intel
          path: macos-intel

      - name: Download ARM Binary
        uses: actions/download-artifact@v4
        with:
          name: nexus-remote-client-macos-arm
          path: macos-arm

      - name: Make binaries executable
        run: |
          chmod +x macos-intel/wot-remote-client
          chmod +x macos-arm/wot-remote-client

      - name: Verify architectures
        run: |
          echo "=== Intel binary ==="
          file macos-intel/wot-remote-client
          lipo -info macos-intel/wot-remote-client
          echo ""
          echo "=== ARM binary ==="
          file macos-arm/wot-remote-client
          lipo -info macos-arm/wot-remote-client

      - name: Create Universal Binary with lipo
        run: |
          mkdir -p pkg-root/usr/local/bin
          lipo -create \
            -output pkg-root/usr/local/bin/nexus-remote-client \
            macos-intel/wot-remote-client \
            macos-arm/wot-remote-client
          chmod +x pkg-root/usr/local/bin/nexus-remote-client
          echo "=== Universal Binary ==="
          file pkg-root/usr/local/bin/nexus-remote-client
          lipo -info pkg-root/usr/local/bin/nexus-remote-client

      - name: Build macOS PKG Installer
        run: |
          pkgbuild \
            --identifier com.nexus.remote.client \
            --version "0.1.0" \
            --root pkg-root \
            --install-location "/" \
            nexus-remote-client-universal.pkg
          echo "=== PKG created ==="
          ls -lh nexus-remote-client-universal.pkg

      - name: Upload Universal Binary (raw)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-macos-universal
          path: pkg-root/usr/local/bin/nexus-remote-client

      - name: Upload PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-macos-universal-pkg
          path: nexus-remote-client-universal.pkg

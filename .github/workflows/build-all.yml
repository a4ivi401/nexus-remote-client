name: Build Releases

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ────────────────── Linux ──────────────────
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Build
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-linux
          path: target/release/wot-remote-client

  # ────────────────── Windows ──────────────────
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: Setup GStreamer
        uses: blinemedical/setup-gstreamer@v1.4.0
        with:
          version: '1.26.11'
          arch: 'x86_64'

      - name: Build
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-windows
          path: target/release/wot-remote-client.exe

  # ────────────────── macOS (both architectures on one runner) ──────────────────
  build-macos:
    name: Build macOS (Universal Binary)
    runs-on: macos-14  # Apple Silicon — fast, always available
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-universal-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-universal-cargo-

      # Install ARM GStreamer (native)
      - name: Install GStreamer (ARM native)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install pkg-config gstreamer
          echo "=== ARM GStreamer installed ==="
          pkg-config --modversion gstreamer-1.0

      # Build ARM binary (native, fast)
      - name: Build ARM binary
        run: |
          cargo build --release
          echo "=== ARM binary ==="
          file target/release/wot-remote-client
          lipo -info target/release/wot-remote-client

      # Install Rosetta 2 for x86_64 emulation
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Install x86_64 Homebrew + GStreamer under Rosetta
      - name: Install x86_64 GStreamer (via Rosetta)
        run: |
          # Install x86_64 Homebrew to /usr/local
          arch -x86_64 /bin/bash -c "NONINTERACTIVE=1 $(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # Install x86_64 GStreamer (|| true ignores non-critical symlink conflicts with pre-installed Python)
          arch -x86_64 /usr/local/bin/brew install --overwrite pkg-config gstreamer || true
          # Verify it actually installed
          echo "=== x86_64 GStreamer installed ==="
          arch -x86_64 /usr/local/bin/pkg-config --modversion gstreamer-1.0

      # Build x86_64 binary (cross-compile via Rosetta libs)
      - name: Build x86_64 binary
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ""
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: "clang"
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: "-C link-arg=-arch -C link-arg=x86_64 -L /usr/local/lib"
        run: |
          cargo build --release --target x86_64-apple-darwin
          echo "=== x86_64 binary ==="
          file target/x86_64-apple-darwin/release/wot-remote-client
          lipo -info target/x86_64-apple-darwin/release/wot-remote-client

      # Create Universal Binary
      - name: Create Universal Binary
        run: |
          lipo -create \
            -output wot-remote-client-universal \
            target/release/wot-remote-client \
            target/x86_64-apple-darwin/release/wot-remote-client
          chmod +x wot-remote-client-universal
          echo "=== Universal Binary ==="
          file wot-remote-client-universal
          lipo -info wot-remote-client-universal

      # Build .pkg installer
      - name: Build macOS PKG
        run: |
          mkdir -p pkg-root/usr/local/bin
          cp wot-remote-client-universal pkg-root/usr/local/bin/nexus-remote-client
          chmod +x pkg-root/usr/local/bin/nexus-remote-client
          pkgbuild \
            --identifier com.nexus.remote.client \
            --version "0.1.0" \
            --root pkg-root \
            --install-location "/" \
            nexus-remote-client-universal.pkg
          ls -lh nexus-remote-client-universal.pkg

      - name: Upload Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-macos-universal
          path: wot-remote-client-universal

      - name: Upload PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-remote-client-macos-universal-pkg
          path: nexus-remote-client-universal.pkg
